[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Voice-driven desktop AI assistant for James Duran"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "James Duran", email = "itsupport@omnichannelsol.com"}]
license = {text = "Apache-2.0"}

dependencies = [
  "anthropic>=0.28.0",
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-telegram-bot>=21.0",
  "pystray>=0.19.0",
  "pyyaml>=6.0",
  "structlog>=24.0.0",
  "pyaudio>=0.2.13",
  "sounddevice>=0.4.6",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "httpx>=0.25.0",
  "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.1.0",
  "mypy>=1.7.0",
  "types-pyyaml>=6.0.0",
  "types-requests>=2.31.0",
]
openjarvis = [
  "openjarvis>=0.5.0",
]

[project.urls]
Repository = "https://github.com/jamesduran/jarvis"
Documentation = "https://github.com/jamesduran/jarvis#readme"

[tool.hatch.build.targets.wheel]
packages = ["brain", "hands", "policy", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "openjarvis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pystray.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sounddevice.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=policy --cov=brain --cov=hands --cov-report=term-missing --cov-fail-under=80"
